  <script src="script.js"></script>
  <script>
    const menuData = {
      "Plats": [
        { name: "POULET ITALIEN", price: "2000 DA", description: "Poulet mariné, sauce italienne, mozzarella", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Poulet%20italien.glb" },
        { name: "CORDON BLEU", price: "2200 DA", description: "Escalope de poulet, jambon de dinde, fromage, chapelure", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Cordon%20bleu%20jm.glb" },
        { name: "FILET DE VOLAILLE A LA CREME", price: "1900 DA", description: "Filet de volaille, sauce crème", glb: "" },
        { name: "FILET DE BOEUF", price: "3800 DA", description: "Filet de bœuf, sauce au poivre, champignons", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Filet%20jm.glb" },
        { name: "ENTRECOTE DE BŒUF", price: "3400 DA", description: "Entrecôte, beurre maître d'hôtel", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Entreco%CC%82te%20jm.glb" },
        { name: "MÉDAILLON DE BŒUF", price: "4000 DA", description: "Médaillon de bœuf, sauce forestière", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Me%CC%81daillon.glb" },
        { name: "LE PRESTIGE DU BOUCHER", price: "5800 DA", description: "Assortiment de viandes, sauce maison", glb: "" },
        { name: "NOISETTE D'AGNEAUX", price: "3200 DA", description: "Agneau tendre, herbes aromatiques, sauce ail-romarin", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Noix%20jm.glb" },
        { name: "MÉSHOUI D'AGNEAUX", price: "4200 DA", description: "Agneau rôti, épices orientales", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Me%CC%81choui%20jm.glb" },
        { name: "MHAMAR", price: "4200 DA", description: "Viande mijotée, épices, sauce rouge, oignons confits", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Mhamar%20jm.glb" },
        { name: "CÔTE D'AGNEAU", price: "3400 DA", description: "Côtelettes d'agneau, thym, ail", glb: "" },
        { name: "CÔTE DE BOEUF", price: "KG/DA", description: "Côte de bœuf, sauce maison", glb: "" },
        { name: "FOIE D'AGNEAU", price: "4200 DA", description: "Foie d'agneau, ail, persil, épices", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Kebdati.glb" }
      ]
    };

    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('menu-grid');
      if (!grid) return;

      const items = menuData["Plats"] || [];
      
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        
        let modelHTML = '';
        if (item.glb && item.glb.trim() !== '') {
          modelHTML = `<div class="model-container" data-glb="${item.glb}"><div class="model-placeholder"><i class="fas fa-cube"></i><span>Chargement 3D...</span></div></div>`;
        } else {
          modelHTML = `<div class="model-container no-model"><i class="fas fa-utensils"></i></div>`;
        }

        card.innerHTML = `
          ${modelHTML}
          <div class="dish-info">
            <h3>${item.name}</h3>
            <p class="dish-description">${item.description}</p>
            <span class="dish-price">${item.price}</span>
          </div>
        `;
        
        grid.appendChild(card);
      });

      initModelViewers();
    });
  </script>
</body>
</html>
