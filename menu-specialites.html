  <script src="script.js"></script>
  <script>
    const menuData = {
      "Spécialités": [
        { name: "TADJINE ESPADON", price: "4500 DA", description: "Espadon, sauce rouge, olives, poivron", glb: "https://pub-2f8ac4bc988c4083b70ddee2532f9d07.r2.dev/tadjine%20espadon.glb" },
        { name: "TADJINE CALAMAR", price: "4200 DA", description: "Calamars, sauce tomate", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20calamar%20jm.glb" },
        { name: "TADJINE JBEN", price: "3200 DA", description: "Viande hachée, fromage, crème fraîche, champignons", glb: "https://pub-2f8ac4bc988c4083b70ddee2532f9d07.r2.dev/jben.glb" },
        { name: "TADJINE DORADE", price: "4000 DA", description: "Dorade, légumes, olives, tomate cerise, poivron", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20dorade.glb" },
        { name: "DOLMA DE SARDINE", price: "2600 DA", description: "Sardines hachée, riz, sauce rouge", glb: "https://pub-2f8ac4bc988c4083b70ddee2532f9d07.r2.dev/dolma.glb" },
        { name: "TADJINE ZITOUN", price: "2500 DA", description: "Olives dénoyautées, poulet, champignons", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20z.glb" },
        { name: "TADJINE HLOU", price: "4200 DA", description: "Viande, pruneaux, apricots, amandes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20hlo.glb" },
        { name: "TADJINE VIANDE", price: "4200 DA", description: "Viande d'agneau, légumes de saison", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20viande%20jm.glb" },
        { name: "TADJINE FRUITS DE MER", price: "4200 DA", description: "Fruits de mer, sauce tomate, épices", glb: "https://pub-2f8ac4bc988c4083b70ddee2532f9d07.r2.dev/tadjine%20fruits%20de%20mer.glb" }
      ]
    };

    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('menu-grid');
      if (!grid) return;

      const items = menuData["Spécialités"] || [];
      
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        
        let modelHTML = '';
        if (item.glb && item.glb.trim() !== '') {
          modelHTML = `<div class="model-container" data-glb="${item.glb}"><div class="model-placeholder"><i class="fas fa-cube"></i><span>Chargement 3D...</span></div></div>`;
        } else {
          modelHTML = `<div class="model-container no-model"><i class="fas fa-utensils"></i></div>`;
        }

        card.innerHTML = `
          ${modelHTML}
          <div class="dish-info">
            <h3>${item.name}</h3>
            <p class="dish-description">${item.description}</p>
            <span class="dish-price">${item.price}</span>
          </div>
        `;
        
        grid.appendChild(card);
      });

      initModelViewers();
    });
  </script>
</body>
</html>
