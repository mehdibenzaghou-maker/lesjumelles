  <script src="script.js"></script>
  <script>
    const menuData = {
      "Tradition": [
        { name: "COUSCOUS VIANDE D'AGNEAU", price: "4200 DA", description: "Semoule, viande d'agneau, légumes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Couscous%20viande.glb" },
        { name: "RECHTA POULET", price: "2200 DA", description: "Pâtes rechta, poulet, légumes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Rechta%20poulet.glb" },
        { name: "RECHTA VIANDE D'AGNEAU", price: "4200 DA", description: "Pâtes rechta, viande d'agneau, légumes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Rechta%20viande.glb" },
        { name: "ROGAG POULET", price: "1800 DA", description: "Rogag, poulet, légumes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Rogag.glb" },
        { name: "ROGAG VIANDE D'AGNEAU", price: "4200 DA", description: "Rogag, viande d'agneau, légumes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Rogag%20viande.glb" },
        { name: "MTAOUEM", price: "3900 DA", description: "Boulettes de viande, agneau, amandes", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Tajine%20mtaouem.glb" },
        { name: "CHTITHA POISSON", price: "2600 DA", description: "Sardines, sauce d'arssa, pommes de terre", glb: "https://pub-2f8ac4bc988c4083b70ddee2532f9d07.r2.dev/chtitha.glb" },
        { name: "COUSCOUS ROYALE", price: "5000 DA", description: "Agneau, veau, poulet, semoule, légumes, tfaya", glb: "https://pub-72b1924cc2494065a2af6bf69f360686.r2.dev/Couscous%20royale%20.glb" }
      ]
    };

    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('menu-grid');
      if (!grid) return;

      const items = menuData["Tradition"] || [];
      
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        
        let modelHTML = '';
        if (item.glb && item.glb.trim() !== '') {
          modelHTML = `<div class="model-container" data-glb="${item.glb}"><div class="model-placeholder"><i class="fas fa-cube"></i><span>Chargement 3D...</span></div></div>`;
        } else {
          modelHTML = `<div class="model-container no-model"><i class="fas fa-utensils"></i></div>`;
        }

        card.innerHTML = `
          ${modelHTML}
          <div class="dish-info">
            <h3>${item.name}</h3>
            <p class="dish-description">${item.description}</p>
            <span class="dish-price">${item.price}</span>
          </div>
        `;
        
        grid.appendChild(card);
      });

      initModelViewers();
    });
  </script>
</body>
</html>
